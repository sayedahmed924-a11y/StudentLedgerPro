name: Build StudentLedgerPro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 PyQt6-WebEngine pandas openpyxl xlrd rapidfuzz pyinstaller

    - name: Build Application with PyInstaller
      run: |
        pyinstaller --noconsole --collect-all PyQt6 --collect-all PyQt6_WebEngine --collect-all rapidfuzz --icon=app_icon.ico --add-data "app_icon.ico;." --name="StudentLedgerPro" app.py

    - name: Upload Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: StudentLedgerPro-EXE
        path: dist/

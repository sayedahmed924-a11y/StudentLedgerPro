name: Build StudentLedgerPro

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 PyQt6-WebEngine pandas openpyxl rapidfuzz pyinstaller

    - name: Compile EXE
      run: |
        pyinstaller --noconsole --collect-all PyQt6 --collect-all PyQt6_WebEngine --collect-all rapidfuzz --icon=app_icon.ico --name="StudentLedgerPro" app.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: StudentLedgerPro-Windows-EXE
        path: dist/

name: Build StudentLedgerPro

on:
  workflow_dispatch:
  pull_request:
    branches: [main, phase2/arabic-ui, phase5/continuous-excel-learning, phase8/merged-cells-and-content-profiling]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pyinstaller

    - name: Check Python Syntax
      run: |
        python -m py_compile app.py

    - name: Run SQLite Database Tests
      run: |
        python -m unittest discover -s tests -v

    - name: Build Application with PyInstaller
      run: |
        pyinstaller --noconsole --clean --collect-all PyQt6 --collect-all PyQt6_WebEngine --collect-all rapidfuzz --icon=app_icon.ico --add-data "app_icon.ico;." --name="StudentLedgerPro" app.py

    - name: Upload Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: StudentLedgerPro-EXE
        path: dist/
